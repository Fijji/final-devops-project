apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.appName | quote }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ .Values.appsRepoUrl | quote }}
    targetRevision: {{ .Values.appsRepoRev | quote }}
    path: {{ .Values.appsRepoPath | quote }}
    helm:
      skipCrds: false
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.appNamespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
